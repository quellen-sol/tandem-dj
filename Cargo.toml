[workspace]
resolver = "2"
members = ["crates/tandem-core", "crates/tandem"]

[workspace.package]
version = "0.15.1"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = "line-tables-only"

# Decoding and DSP are unusably slow unoptimised; keep debug builds fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
