name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tandem-core

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Core tests
        run: cargo test -p tandem-core --release

      - name: Build tandem.exe
        run: cargo build -p tandem --release

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\tandem.exe -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\tandem.exe, windows\record-midi.bat, README.md, TERMS.md, LICENSE, THIRD_PARTY.md dist\
          Compress-Archive -Path dist\* -DestinationPath tandem-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tandem-windows-x64
          path: tandem-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tandem-windows-x64.zip
          generate_release_notes: true
